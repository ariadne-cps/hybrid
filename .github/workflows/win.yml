name: Windows
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
        build_type: [Debug, Release]
    steps:
      - name: Enable long Git paths
        shell: pwsh
        run: git config --system core.longpaths true
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DWARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2 --target everything
      - name: Test
        run: ctest --test-dir build --output-on-failure
